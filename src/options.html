<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hunch settings</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #111; }
  label { display: block; font-weight: 600; margin-top: 20px; }
  input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #bbb; border-radius: 6px; margin-top: 6px; }
  small { color: #555; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; cursor: pointer; }
  .row input:focus { border-color: #d97706; outline: none; box-shadow: 0 0 0 2px rgba(217,119,6,.25); }
  button.secondary { margin-top: 6px; background: #fff; color: #111; }
  #shortcutNote { display: block; min-height: 1.2em; margin-top: 4px; }
  button.link { all: unset; color: #1d4ed8; text-decoration: underline; cursor: pointer; font: inherit; }
  button { margin-top: 20px; font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; }
  #saved { margin-left: 10px; color: #15803d; }
</style></head>
<body>
  <h1>Hunch</h1>
  <p>Only the text of the page you invoke it on is sent to your chosen provider, and only while the find bar is open.</p>
  <p id="nokey" style="display:none;padding:10px 12px;border-radius:6px;background:#fef3c7;color:#92400e">You need an API key before the first search. Create one at <a id="keysLink" href="https://console.typesafe.ai/keys" target="_blank">the provider console</a>, paste it below, and save.</p>
  <label>Provider <select id="provider"></select></label>
  <label><span id="apiKeyLabel">API key</span> <input id="apiKey" type="password"></label>
  <label>Model <small id="modelNote"></small>
    <input id="model" list="modelOptions" autocomplete="off">
    <datalist id="modelOptions"></datalist></label>
  <label>Shortcut <small id="shortcutHint">Click the field and press the keys you want.</small>
    <span class="row">
      <input id="shortcut" type="text" readonly placeholder="…">
      <button id="resetShortcut" type="button" class="secondary">Reset to default</button>
    </span>
    <small id="shortcutNote"></small></label>
  <button id="save" type="button">Save</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
